<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Reflex Rider Login</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f4f4;
            padding: 40px;
        }

        .login-box {
            max-width: 400px;
            margin: 80px auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
        }

        input {
            width: 100%;
            box-sizing: border-box;
            padding: 12px;
            margin: 10px 0;
        }

        button {
            padding: 12px 20px;
            cursor: pointer;
        }

        #message {
            margin-top: 15px;
            font-weight: bold;
        }
    </style>

</head>

<body>

    <div class="login-box">

        <h1>Reflex Rider Login</h1>

        <p>Enter your registered phone number.</p>

        <input
            type="text"
            id="phone"
            placeholder="0712345678"
        >

        <button onclick="login()">
            Login
        </button>

        <p id="message"></p>

    </div>

    <script src="rider-login.js"></script>

</body>

</html>
